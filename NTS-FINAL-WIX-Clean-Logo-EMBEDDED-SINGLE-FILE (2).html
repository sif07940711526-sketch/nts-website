ge a fixed £250+VAT total for your first 3 pensions found (£300 incl VAT). To start work we take a £100+VAT non-refundable deposit on engagement (£120 incl VAT) which covers Fact Find setup, LOA preparation, initial provider letters and admin. The £150+VAT balance (£180 incl VAT) is due on completion when we deliver your clear report — including written 'no trace' confirmations if no pensions are found. This structure covers the professional time and 4-12 weeks chasing undertaken, whether we find pots or confirm none exist. Free Initial Review helps assess likelihood before you pay any deposit."},{q:"What if you find no pensions?",a:"The £100+VAT deposit on engagement is non-refundable as it covers work undertaken from day one: Fact Find, LOA prep, initial provider letters, ID checks and admin setup. The remaining £150+VAT balance is due on completion even if the outcome is a confirmed 'no trace' — because we still complete 4-12 weeks of chasing, provider responses and written confirmations for your audit trail. The £250+VAT total (£300 incl VAT) covers the first 3 pensions and is not a success fee. Our Free Initial Review helps assess likelihood before any deposit is paid."},{q:"Is the £250+VAT fee really fixed? What about the first 3 pensions?",a:"Yes. One fixed fee of £250+VAT (£300 incl. VAT) total for the first 3 pensions found. That's £100+VAT (£120 incl) non-refundable deposit on engagement to secure your trace and start work, plus £150+VAT (£180 incl) balance on completion when we deliver your report. It includes Fact Find, up to 20 provider letters (Aviva, L&G, Scottish Widows etc), LOA handling, ID verification, 4-12 weeks chasing, written 'no trace' confirmations, and one clear report. No percentage taken from your pot, no hidden charges, no ongoing fees."},{q:"Why do you charge a fixed fee when others charge a percentage?",a:"Many firms charge 15-25% of your pension value. On a £30,000 pension, that's £4,500-£7,500. We believe that's excessive for tracing work. Our £250+VAT total fixed fee (£100+VAT deposit, £150+VAT balance) for the first 3 pensions keeps the vast majority of your money where it belongs — with you."},{q:"Will you move or consolidate my pensions?",a:"No. We are a tracing service, not an adviser. We find your pensions and provide a clear summary of what we found, where it is, and its current status. What you do next is entirely up to you — we do not move, merge or give advice on your pensions."},{q:"How long does it take?",a:"Initial review results are typically within 5-10 working days. Full tracing depends on providers responding, but most cases are completed within 3-6 weeks. We keep you updated throughout."}];function ei(){let[e,t]=Zc.useState(1);return f("div",{className:"min-h-screen bg-[#FCFBF8] text-[#0A1F3F] antialiased selection:bg-[#C9A86A]/30",children:[a("style",{children:`
